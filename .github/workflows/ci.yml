name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing you still need.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests, lint and a production build. Fast, and the first thing to go red
  # for an ordinary mistake.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so the floor lives in one place. It is a real floor:
          # below 22.13 the app crashes on node:sqlite rather than degrading.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Coverage rather than a bare `npm test`: it costs a second or two, and
      # the thresholds in vitest.config.ts are only enforced when it runs. They
      # cover the pure layers only, at the value measured when they were set —
      # so this goes red when a layer loses cover, not when one is merely thin.
      # The JSON reporter is here for one reason: twice on this project a single
      # test has failed on a run ~40% slower than baseline and passed on every
      # rerun, and *the name was never captured*. The 20 s timeout in
      # vitest.config.ts is a mitigation for that, not a diagnosis. This makes
      # the next occurrence name itself.
      - run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=test-results.json

      # The numbers, where you can read them without downloading anything.
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% | ${s[k].covered}/${s[k].total} |`;
            console.log("| | % | covered |\n|---|---|---|");
            for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
          ' >> "$GITHUB_STEP_SUMMARY"

      # Which test, and how slow the run was — the two things nobody had when
      # the unexplained failure happened. The slowest five go in even on a green
      # run, so there is a baseline to compare the next red one against.
      - name: Test failures and timings
        if: always()
        run: |
          node -e '
            const r = require("./test-results.json");
            const all = r.testResults.flatMap((f) =>
              f.assertionResults.map((a) => ({ ...a, file: f.name.split(/[\\/]/).pop() })));
            const failed = all.filter((a) => a.status === "failed");
            const out = [];
            if (failed.length > 0) {
              out.push("### Failed", "");
              for (const a of failed) {
                out.push(`- \`${a.file}\` — ${a.fullName}`);
                out.push("  ```", "  " + (a.failureMessages[0] ?? "").split("\n")[0], "  ```");
              }
              out.push("");
            }
            const slow = all.sort((a, b) => (b.duration ?? 0) - (a.duration ?? 0)).slice(0, 5);
            out.push("### Slowest five", "", "| ms | test |", "|---|---|");
            for (const a of slow) out.push(`| ${Math.round(a.duration ?? 0)} | ${a.file} — ${a.title} |`);
            out.push("", `${r.numTotalTests} tests, ${r.numFailedTests} failed.`);
            console.log(out.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage
          path: |
            coverage/coverage-summary.json
            test-results.json

      - run: npm run lint

      # Informational, never a gate. Dependabot already opens the PRs; this is
      # the standing picture between them, and it is `continue-on-error` on
      # purpose: an advisory published against a transitive dev dependency must
      # not be able to stop a raid-night fix from shipping. `--omit=dev` because
      # nothing in devDependencies is reachable from the running server.
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --omit=dev

      # `npm run build`, never `next build` — the npm script also runs
      # check-dynamic-routes.mjs and prune-standalone.mjs, which are the two
      # guards standing between a mistake and a shipped artifact.
      #
      # Deliberately no secrets and no .env file. This job builds the way a
      # container build does, which is the *only* way the prerender bug is
      # visible: with PROJECTLC_AUTH set, every route renders dynamic and the
      # build looks perfectly healthy.
      - run: npm run build

  # Build the real artifact and probe it. This job exists because on
  # 30 Aug 2026 two security bugs passed the whole suite above and were only
  # visible in a running container.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: projectlc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash scripts/smoke-image.sh projectlc:ci
