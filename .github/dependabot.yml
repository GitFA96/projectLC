version: 2
updates:
  # The app's own dependencies. Grouped so a week of patch bumps is one PR to
  # review rather than fifteen — a solo maintainer ignores fifteen.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait for a release to survive contact with everyone else before it is
    # offered here. Day-one majors are what actually cost this project time:
    # typescript 7 and eslint 10 both arrived before `typescript-eslint` and
    # `eslint-config-next` had published ranges that admit them, so both are
    # held in docs/backlog.md waiting on somebody else's release rather than on
    # a decision. A month of cooldown on a major is roughly how long that takes.
    #
    # This delays *version* updates only — a security advisory still opens its
    # PR the day it lands, which is the half that must not wait.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      patch-and-minor:
        update-types: [minor, patch]

  # The Dockerfile's base image. With this watching it, pinning a digest becomes
  # a reasonable option — see the note at the top of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The base image is a floating `node:NN-alpine` tag, so the only thing
    # Dependabot ever proposes here is the next major — and this deployment's
    # standing answer is to run the LTS line, one guild's live data behind one
    # replica. Node's even majors ship in April and promote in October, so ~180
    # days turns "a major is out" into "a major is about to be LTS", which is
    # the decision that was made for Node 26 by hand. Docker tags are not
    # semver, so `default-days` is the only dial the ecosystem offers.
    cooldown:
      default-days: 180

  # The workflow actions above. Unwatched pinned actions rot quietly.
  #
  # Grouped for the same reason the npm block is: five separate one-line PRs
  # landed on 7 Sep 2026, each needing its own review and its own CI run, and
  # the review that matters is "do the actions still do what ci.yml expects",
  # which is one question about all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
